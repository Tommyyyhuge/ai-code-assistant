# 生产环境 Docker Compose 配置
# 用法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # 生产环境不建议暴露数据库端口
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  backend:
    restart: unless-stopped
    # 生产模式：移除热重载挂载，使用构建镜像而非卷挂载
    volumes: []
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ALGORITHM=${ALGORITHM:-HS256}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  worker:
    restart: unless-stopped
    volumes: []
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    # 生产环境：移除 privileged 模式，不再需要 worker 级 seccomp（已在内层容器应用）
    privileged: false

  frontend:
    restart: unless-stopped
    # 生产模式：使用 nginx 静态服务
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes: []
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-production}
      - VITE_SENTRY_TRACES_SAMPLE_RATE=${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    # 生产模式：nginx 静态服务（Dockerfile.prod 内已构建）
    command: []

volumes:
  postgres_data:
  redis_data:
